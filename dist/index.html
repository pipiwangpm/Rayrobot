<body>
  <div id="app"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
    (() => {
      'use strict';
      const classes = [
        { id:'unripe', name:'未熟果串', zone:'A', weight:9 },
        { id:'black', name:'坚果／黑果', zone:'B', weight:5 },
        { id:'empty', name:'空果串', zone:'B', weight:5 },
        { id:'ripe', name:'成熟果串', zone:'C', weight:54 },
        { id:'overripe', name:'过熟果串', zone:'C', weight:13 },
        { id:'long', name:'长柄果串', zone:'C', weight:8 },
        { id:'small', name:'小果串', zone:'C', weight:6 }
      ];
      const zones = [
        { id:'A', name:'A 区 · 观察区' },
        { id:'B', name:'B 区 · 剔除区' },
        { id:'C', name:'C 区 · 主通道' }
      ];
      const slots = [
        [4,10,220], [8,15,210], [11,30,160],
        [15,10,225], [19,30,130], [23,20,290]
      ];
      const dataCutoff = new Date(2026,9,14,17,40,0);
      const pad = n => String(n).padStart(2,'0');
      const dateKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
      const dateTime = d => `${dateKey(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
      const dateTimeSeconds = d => `${dateTime(d)}:${pad(d.getSeconds())}`;
      const inputTime = d => `${dateKey(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
      const number = n => n.toLocaleString('zh-CN');
      const percent = (part,total) => total ? `${(part/total*100).toFixed(1)}%` : '0.0%';
      const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const blankCounts = () => Object.fromEntries(classes.map(c => [c.id,0]));
      function random(seed){let x=seed>>>0;return () => {x=(x*1664525+1013904223)>>>0;return x/4294967296;};}
      function pickClass(r){const n=r()*100;let sum=0;for(const c of classes){sum+=c.weight;if(n<sum)return c;}return classes[classes.length-1];}
      function createDemoData(){
        const batches=[],detections=[];
        let dayIndex=0;
        for(let day=new Date(2026,8,1);day<=dataCutoff;day.setDate(day.getDate()+1),dayIndex++){
          for(let slotIndex=0;slotIndex<slots.length;slotIndex++){
            const [hour,minute,duration]=slots[slotIndex];
            const start=new Date(day.getFullYear(),day.getMonth(),day.getDate(),hour,minute);
            if(start>dataCutoff)continue;
            const plannedEnd=new Date(start.getTime()+duration*60000);
            const ended=plannedEnd<=dataCutoff;
            const id=`PB-${dateKey(start).replaceAll('-','')}-${pad(slotIndex+1)}`;
            const batch={id,start,end:null,counts:blankCounts(),total:0};
            const rand=random((dayIndex+1)*6371+(slotIndex+1)*2909);
            const plannedCount=48+(dayIndex*7+slotIndex*11)%31;
            for(let i=0;i<plannedCount;i++){
              const at=new Date(start.getTime()+Math.round((i+.5)/plannedCount*duration)*60000);
              if(at>dataCutoff)break;
              const cls=pickClass(rand);
              detections.push({batchId:id,at,classId:cls.id});
              batch.counts[cls.id]++;
              batch.total++;
              if(ended)batch.end=at;
            }
            batches.push(batch);
          }
        }
        return {batches,detections};
      }
      const demo=createDemoData();
      const defaultStart='2026-10-08T00:00';
      const defaultEnd='2026-10-14T23:59';
      function createRecordData(){
        const perDay=new Map();
        return demo.detections.filter(item=>item.at>=new Date(defaultStart)).reverse().map((item,index)=>{
          const day=dateKey(item.at).replaceAll('-','');
          const sequence=(perDay.get(day)||0)+1;perDay.set(day,sequence);
          const original=classes.find(c=>c.id===item.classId);
          const status=index%23===8?'failed':index%13===3&&item.at.getTime()<dataCutoff.getTime()-7200000?'reviewed':original.zone==='A'?'pending':'recognized';
          const finalClass=status==='reviewed'?classes[(classes.findIndex(c=>c.id===item.classId)+1)%classes.length]:original;
          const confidence=status==='failed'?null:0.68+(index%28)*0.011;
          const reviewHistory=status==='reviewed'?[{beforeId:original.id,afterId:finalClass.id,at:new Date(item.at.getTime()+45*60000),note:''}]:[];
          return {id:`PF-${day}-${String(sequence).padStart(4,'0')}`,batchId:item.batchId,at:item.at,status,originalClass:status==='failed'?null:original,finalClass:status==='failed'?null:finalClass,route:status==='failed'?null:original.zone,confidence,reviewHistory};
        });
      }
      const records=createRecordData();
      const recordById=new Map(records.map(record=>[record.id,record]));

      function reportPreview(){

      function render(){renderCore();applyLanguage();}
      function applyQuery(){

        const start=new Date(state.recordDraft.start).getTime(),end=new Date(state.recordDraft.end).getTime();
        if(!Number.isFinite(start)||!Number.isFinite(end)){state.error='请选择有效的检测起止时间。';render();return;}

      function startReview(recordId){

        state.reviewDraftClass=record.finalClass?.id||'';state.reviewDraftNote='';state.reviewError='';render();

        const record=recordById.get(state.selectedRecordId);

        if(!selected){state.reviewError='请选择确认后的分类。';render();if(typeof requestAnimationFrame==='function')requestAnimationFrame(()=>document.getElementById('review-class')?.focus());return;}
        record.reviewHistory.push({beforeId:record.finalClass?.id||null,afterId:selected.id,at:new Date(),note:state.reviewDraftNote.trim()});

        if(action==='dashboard-grain'){state.dashboardGrain=control.dataset.grain;render();return;}
        if(action==='dashboard-record'){state.selectedRecordId=control.dataset.recordId;state.reviewMode=false;render();return;}
        if(action==='dashboard-filter'){const shift=bucket(state.dashboardNow,'shift');state.recordDraft={id:'',batch:'',start:inputTime(shift.start),end:inputTime(state.dashboardNow),status:control.dataset.status,classification:''};state.recordApplied={...state.recordDraft};state.view='records';state.page=1;location.hash='#page=records';render();return;}
        if(action==='query'){applyQuery();return;}
        if(action==='reset'){state.draftStart=defaultStart;state.draftEnd=defaultEnd;state.start=defaultStart;state.end=defaultEnd;state.grain='day';state.batchQuery='';state.appliedBatchQuery='';state.error='';state.page=1;render();return;}
        if(action==='record-query'){applyRecordQuery();return;}
        if(action==='record-reset'){state.recordDraft={id:'',batch:'',start:defaultStart,end:defaultEnd,status:'',classification:''};state.recordApplied={...state.recordDraft};state.error='';state.page=1;render();return;}
        if(action==='view'){state.view=control.dataset.view;state.selectedRecordId=null;state.reviewMode=false;state.cameraOpen=false;state.reportOpenId=null;state.settingsModal=null;state.settingsDraft=null;state.page=1;state.error='';if(typeof location!=='undefined')location.hash=`#page=${state.view}`;render();return;}
        if(action==='record-detail'){state.selectedRecordId=control.dataset.recordId;state.reviewMode=false;render();return;}
        if(action==='record-review'){startReview(control.dataset.recordId);return;}
        if(action==='start-review'){startReview(state.selectedRecordId);return;}
        if(action==='cancel-review'){state.reviewMode=false;state.reviewError='';render();return;}
        if(action==='confirm-review'){confirmReview();return;}
        if(action==='close-detail'){state.selectedRecordId=null;state.reviewMode=false;render();return;}
        if(action==='detail-backdrop'){if(event.target===control){state.selectedRecordId=null;state.reviewMode=false;render();}return;}
        if(action==='prev'){state.page=Math.max(1,state.page-1);render();return;}
        if(action==='next'){state.page++;render();return;}
        if(action==='batch-query'){state.appliedBatchQuery=state.batchQuery;state.page=1;render();return;}
        if(action==='export')showToast('演示版暂不生成文件。');
      });
      if(typeof window!=='undefined')window.addEventListener('hashchange',()=>{
        const next=hashView();
        if(validViews.includes(next)&&next!==state.view){state.view=next;state.selectedRecordId=null;state.reviewMode=false;state.page=1;state.error='';render();}
      });
      render();
      if(typeof window!=='undefined')window.setInterval(dashboardRefresh,10000);
    })();
  </script>
</body>
</html>
